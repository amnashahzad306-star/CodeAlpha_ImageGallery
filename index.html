<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="gallery-header">
    <p class="eyebrow">Selected Frames</p>
    <h1>Gallery</h1>
    <nav class="filters" id="filters" aria-label="Filter by category">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="nature">Nature</button>
      <button class="filter" data-filter="architecture">Architecture</button>
      <button class="filter" data-filter="travel">Travel</button>
      <button class="filter" data-filter="portrait">Portrait</button>
    </nav>
  </header>

  <main class="gallery" id="gallery" aria-live="polite"></main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous image">&#8249;</button>
    <div class="lightbox-stage">
      <img id="lightboxImage" alt="">
      <div class="lightbox-caption">
        <span id="lightboxCaptionText"></span>
        <span class="lightbox-counter" id="lightboxCounter"></span>
      </div>
    </div>
    <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next image">&#8250;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
